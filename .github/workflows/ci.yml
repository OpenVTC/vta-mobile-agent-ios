name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-simulator-test:
    # The consumed VtaMobileCore.xcframework ships iOS slices only, so the
    # smoke test must run on an iOS Simulator destination, not the macOS host.
    name: iOS Simulator test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build + test on iOS Simulator
        # Resolve an available iPhone simulator by UDID rather than pinning a
        # name — the runner image's device list changes with each Xcode bump
        # (e.g. iPhone 16 → iPhone 17-series), which silently breaks a pinned
        # name. Pick the newest available iPhone so the smoke test survives it.
        run: |
          xcrun simctl list devices available | grep -i iphone
          udid="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')"
          echo "Using iOS Simulator $udid"
          xcodebuild test \
            -scheme VtaMobileAgent-Package \
            -destination "platform=iOS Simulator,id=$udid" \
            -skipPackagePluginValidation

  ios-app-build:
    # Generate the app project from project.yml and build the SwiftUI app target
    # for the simulator, so the app (not just the package) stays buildable.
    name: iOS app build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for the iOS Simulator
        # A generic Simulator destination needs no specific device, so the
        # build survives runner-image device-list changes (see the test job).
        run: |
          xcodebuild build \
            -scheme VtaMobileAgentApp \
            -destination 'generic/platform=iOS Simulator'
