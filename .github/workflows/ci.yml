name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-simulator-test:
    # The consumed VtaMobileCore.xcframework ships iOS slices only, so the
    # smoke test must run on an iOS Simulator destination, not the macOS host.
    name: iOS Simulator test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show available simulators
        run: xcrun simctl list devices available | grep -i iphone

      - name: Build + test on iOS Simulator
        # Pins to a simulator name present on the runner image. If the image's
        # device list changes, update the name (see the step above).
        run: |
          xcodebuild test \
            -scheme VtaMobileAgent-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation

  ios-app-build:
    # Generate the app project from project.yml and build the SwiftUI app target
    # for the simulator, so the app (not just the package) stays buildable.
    name: iOS app build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available | grep -i iphone

      - name: Build the app for the iOS Simulator
        run: |
          xcodebuild build \
            -scheme VtaMobileAgentApp \
            -destination 'platform=iOS Simulator,name=iPhone 16'
